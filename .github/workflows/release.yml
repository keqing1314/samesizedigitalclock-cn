name: Release

# 推送 v* 标签时自动发布；也可在 Actions 页面手动指定标签发布
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v1.0.0），需已推送到仓库"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析标签与版本号
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "::error::标签 $TAG 不存在，请先将标签推送到仓库"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "标签: $TAG / 版本: $VERSION"

      - name: 检出该标签的插件源码
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # 发布脚本本身取自默认分支，插件源码取自标签，避免旧标签缺少脚本导致失败
          git checkout "$TAG" -- metadata.json contents CHANGELOG.md
          echo "已载入 $TAG 的插件源码"

      - name: 从 CHANGELOG 提取发布说明
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! python3 scripts/extract_changelog.py "$VERSION" --output release-notes.md; then
            printf '> 本版本暂无更新日志，详见 [CHANGELOG.md](%s/%s/blob/main/CHANGELOG.md)。\n' \
              "$SERVER_URL" "$REPOSITORY" > release-notes.md
          fi
          printf '\n---\n\n### 📦 安装\n\n' >> release-notes.md
          printf '下载下方 `*.plasmoid` 文件，然后在 Plasma 桌面右键 →「添加小部件」→「从本地文件安装」即可。\n' >> release-notes.md
          echo '--- 生成的发布说明 ---'
          cat release-notes.md

      - name: 打包 .plasmoid 安装包
        id: package
        run: |
          python3 scripts/package_plasmoid.py dist
          ARTIFACT="$(ls dist/*.plasmoid | head -1)"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "已生成：$ARTIFACT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          gh release create "$TAG" \
            --title "Digital Clock - Same Size $TAG" \
            --notes-file release-notes.md \
            "$ARTIFACT"
